<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PtsJs Animations</title>
 <link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Fraunces:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600&family=Anton&family=Caveat:wght@700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--dim:#6b6b73;--acc:#ff4d2e;--line:#e8e6e1}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:fixed;z-index:5;left:0;right:0;top:0;height:calc(56px + env(safe-area-inset-top,0px));display:flex;align-items:center;padding:env(safe-area-inset-top,0px) 18px 0;background:#fff;border-bottom:1px solid var(--line)}
.top{justify-content:space-between;gap:12px}.top img{display:block;border-radius:8px}
.sr{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;background:#fff;width:min(320px,62vw)}
.sr input{border:0;outline:0;background:transparent;font:500 14px "Space Grotesk",sans-serif;width:100%;color:var(--ink)}
#gallery{scroll-margin-top:70px}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 20px 70px}
.pager button{min-width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font:500 14px "Space Grotesk",sans-serif;cursor:pointer;padding:0 12px}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.none{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 0}

.hero{position:relative;height:100svh;min-height:520px;display:grid;place-items:center;overflow:hidden;padding-top:56px}
.orb{position:absolute;border-radius:50%;width:46vmax;height:46vmax;background:radial-gradient(circle,var(--c) 0%,transparent 68%);opacity:.7;will-change:transform;animation:drift var(--d) ease-in-out infinite alternate}
.o1{--c:#ffd6c9;left:-12vmax;top:-10vmax;--d:22s}.o2{--c:#d3e2ff;right:-14vmax;top:4vmax;--d:28s}.o3{--c:#d6f3e3;left:14vw;bottom:-20vmax;--d:25s}.o4{--c:#ffe7b0;right:8vw;bottom:-12vmax;--d:31s;width:34vmax;height:34vmax}
@keyframes drift{to{transform:translate3d(7vmax,5vmax,0) scale(1.15)}}
.hero.off .orb{animation-play-state:paused}
.ht{position:relative;margin:0;text-align:center;font:800 clamp(54px,15vw,170px)/.95 Syne,sans-serif;letter-spacing:-.03em;padding:0 16px}
.ht b{display:block;font-weight:800}.ht .l2{font-size:.44em;letter-spacing:-.02em;margin-top:.14em}
.ht i{font-style:normal;display:inline-block;opacity:0;transform:translate3d(0,.5em,0);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*60ms + 150ms)}
.ht .a{color:var(--acc)}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}.ht i{animation:none;opacity:1;transform:none}}
.sub{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--dim);padding:0 20px;pointer-events:none}
.sub b{display:block;margin-top:14px;color:var(--ink);font-weight:500;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
main{max-width:1240px;margin:0 auto;padding:40px 20px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px}

.pv{contain:layout paint;position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;touch-action:pan-y;border:1px solid var(--line)}
.fs{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:8px;border:0;background:#ffffffe0;display:grid;place-items:center;cursor:pointer;transition:.2s;z-index:2}
.fs:hover{transform:scale(1.08);background:#fff}
.meta small{display:block;margin:12px 0 2px;color:var(--acc);font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em}
.meta h3{margin:0;font:700 18px Syne,sans-serif}.meta h3 i{font:400 12px "JetBrains Mono";color:var(--dim);margin-right:8px;font-style:normal}
.meta p{margin:4px 0 10px;color:var(--dim)}
.vc{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:6px 12px;font:500 13px "Space Grotesk";cursor:pointer;transition:.2s}.vc:hover{background:var(--ink);color:#fff}
#ov{position:fixed;inset:0;z-index:20;background:#000;display:none}#ov.on{display:block}
#st{position:absolute;inset:0;touch-action:none}
.bar{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;color:#fff;pointer-events:none;z-index:2}
.bar>*{pointer-events:auto}.bar h2{margin:0;font:700 22px Syne,sans-serif;mix-blend-mode:difference}.bar p{margin:2px 0 0;opacity:.7;font-size:13px;mix-blend-mode:difference}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.act button,.act input{border:1px solid #fff5;background:#0007;color:#fff;border-radius:8px;padding:8px 12px;font:500 13px "Space Grotesk";backdrop-filter:blur(8px);cursor:pointer}
#ed{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#ed[hidden]{display:none}
#ed label{display:flex;flex-direction:column;gap:4px;color:#fff;font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.05em;flex:1 1 220px;max-width:520px}
#ed input{border:1px solid #fff5;background:#000a;color:#fff;border-radius:8px;padding:10px 12px;font:500 15px "Space Grotesk",sans-serif;backdrop-filter:blur(8px);text-transform:none;outline:none}
#ed input:focus{border-color:#fff}
.perr{position:absolute;left:8px;right:8px;bottom:8px;color:#ffb4a6;font:11px/1.3 "JetBrains Mono",monospace;background:#000a;padding:6px 8px;border-radius:6px}
.pv canvas{pointer-events:none;user-select:none}
#cm{position:fixed;inset:0;z-index:30;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}#cm.on{display:flex}
.sheet{background:#fff;border-radius:12px;width:min(900px,100%);max-height:86svh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font:700 15px Syne}
.sheet header div{display:flex;gap:8px}.sheet button{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:6px 12px;font:500 13px "Space Grotesk";cursor:pointer}
.sheet pre{margin:0;padding:16px;overflow:auto;font:12px/1.55 "JetBrains Mono",monospace;background:#fafaf8;tab-size:2}
footer{text-align:center;padding:30px 20px 50px;color:var(--dim);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.card{transition:none}.sub b{animation:none}}
</style></head><body>
<header class="top"><img src="logo.png" alt="PtsJs Animations" width="34" height="34"><label class="sr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b73" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search animations" autocomplete="off" aria-label="Search animations"></label></header>
<section class="hero" id="hero"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span><h1 class="ht" aria-label="PtsJs Animations"><b aria-hidden="true"><i style="--i:0">P</i><i style="--i:1">t</i><i style="--i:2">s</i><i class="a" style="--i:3">J</i><i class="a" style="--i:4">s</i></b><b class="l2" aria-hidden="true"><i style="--i:6">A</i><i style="--i:7">n</i><i style="--i:8">i</i><i style="--i:9">m</i><i style="--i:10">a</i><i style="--i:11">t</i><i style="--i:12">i</i><i style="--i:13">o</i><i style="--i:14">n</i><i style="--i:15">s</i></b></h1><div class="sub">Interactive generative art built with <u>Pts</u>, tap any piece to play, then take the code.<b>Scroll ↓</b></div></section>
<div id="gallery"></div>
<main id="grid"></main>
<nav id="pager" class="pager" aria-label="Pages"></nav>
<footer>Built with <a href="https://github.com/williamngan/pts" style="color:inherit">Pts</a> · MIT-style free to remix</footer>
<div id="ov"><div id="st"></div><div class="bar"><div><h2 id="on"></h2><p id="oh"></p></div><div class="act"><button id="oc">View code</button><button id="x">✕ Close</button></div></div><div id="ed" hidden></div></div>
<div id="cm"><div class="sheet"><header><span id="ct"></span><div><button id="cp">Copy</button><button id="cx">Close</button></div></header><pre id="cc"></pre></div></div>
<div id="err" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fff3f0;border:1px solid #ff4d2e;color:#7a1d0e;border-radius:10px;padding:12px 14px;font:13px/1.45 ui-monospace,monospace"></div>
<script>
function fail(m){const e=document.getElementById('err');e.style.display='block';e.textContent=m}
addEventListener('error',e=>{if(e.message)fail('Script error: '+e.message)});
function load(u,ok,bad){const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
function chain(list,done){const u=list.shift();if(!u){console.warn('Pts CDN unavailable, using built-in fallback');return done(true)}
 load(u,done,()=>{console.warn('failed',u);chain(list,done)})}
const PTS=['https://cdn.jsdelivr.net/npm/pts@0.12.9/dist/pts.min.js','https://unpkg.com/pts@0.12.9/dist/pts.min.js','https://cdn.jsdelivr.net/npm/pts/dist/pts.min.js','https://unpkg.com/pts/dist/pts.min.js'];
// Cache version: bump this number after you deploy changes so visitors get the newest files.
const V=7;
// Loads core.js, then scenes1.js, scenes2.js, scenes3.js ... automatically (any number), then app.js.
// Gaps of up to 2 missing numbers are tolerated, so deleting a file never breaks the page.
chain(PTS,()=>{
 load('core.js?v='+V,()=>{let n=1,miss=0;
  (function next(){if(miss>=3)return load('app.js?v='+V,()=>{},()=>fail('Missing file: app.js, upload it next to index.html.'));
   load('scenes'+n+'.js?v='+V,()=>{miss=0;n++;next()},()=>{miss++;n++;next()})})()},
  ()=>fail('Missing file: core.js, upload it next to index.html.'))});
</script></body></html>
